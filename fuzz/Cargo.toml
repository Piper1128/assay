# Outside the workspace on purpose: cargo-fuzz needs nightly and its own
# target directory, and dragging that toolchain into `cargo build` would make
# every ordinary build carry it (same reasoning as nano-chain's fuzz crate).
[package]
name = "assay-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
assay-data = { path = "../crates/assay-data" }

[[bin]]
name = "decode_dataset"
path = "fuzz_targets/decode_dataset.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
