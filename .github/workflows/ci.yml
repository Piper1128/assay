# CI gates (ADR-010 rev 2).
#
# A commit passes only with: clean formatting, clippy without warnings, a host
# build, assay-core building for a bare-metal target (the no_std purity gate,
# ADR-000 rev 2), all tests green, the one-way trust boundary intact
# (ADR-003), and every negative probe proving its gate can still fail
# (ADR-010 rev 2 §4).
#
# Every port ADR-010 rev 2 names now has a job. The in-process half of the
# determinism requirement lives in crates/assay-core/tests/vectors_slice.rs;
# the fresh-process and second-platform halves are the `determinism` job.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml controls version, components and targets
      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (host)
        run: cargo build --workspace

      # The proof that the no_std boundary holds: assay-core must build for a
      # target with no std at all (ADR-000 rev 2).
      - name: Build (no_std target)
        run: cargo build --target thumbv7em-none-eabi -p assay-core

      - name: Test
        run: cargo test --workspace

      # no_std cannot see this boundary (both crates are std), so it stays an
      # explicit textual gate (ADR-003 §5).
      - name: Trust boundary (assay-data must not depend on assay-scrape)
        run: bash tools/gates/dep_direction.sh

      # One side of the mirror gate (ADR-010 rev 2 §3): the committed vector
      # must regenerate identically from the independent Python mirror, which
      # reads the same data/ directory the Rust loader does. The Rust side
      # replays the file in cargo test (vectors_slice), and assay-data's
      # integration test resolves straight from data/ — so mirror, vector,
      # loader and dataset are pinned to each other from every side.
      - name: Mirror check
        run: python3 mirror/gen_slice_vector.py --check

      # Every gate above must be proven able to fail (ADR-010 rev 2 §4).
      # Mutates the tree and restores it via git — runs last.
      - name: Negative probes
        run: bash probes/run.sh

  # ADR-001 rev 2 §5: the same input must produce byte-identical canonical
  # output across runs AND across platforms. The in-process repeat is a unit
  # test; this covers a fresh process, and the matrix covers the platform.
  # Only the canonical form is compared — the human table is presentation.
  determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Build
        run: cargo build -p assay-cli
      - name: Byte-identical across processes
        shell: bash
        run: |
          set -eu
          for loadout in loadouts/*.toml; do
            a=$(cargo run -q -p assay-cli -- resolve "$loadout" --json)
            b=$(cargo run -q -p assay-cli -- resolve "$loadout" --json)
            if [ "$a" != "$b" ]; then
              echo "non-deterministic across processes: $loadout"
              diff <(echo "$a") <(echo "$b") || true
              exit 1
            fi
            # Printed so the two matrix legs can be compared by eye in the
            # log as well as by the checksum below.
            echo "$loadout: $a"
          done
      - name: Checksum the whole corpus
        shell: bash
        run: |
          set -eu
          for loadout in loadouts/*.toml; do
            cargo run -q -p assay-cli -- resolve "$loadout" --json
          done | shasum -a 256 | tee canonical.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-${{ matrix.os }}
          path: canonical.sha256

  # ADR-001 rev 2 §4: the dataset decoder must never panic. Property tests in
  # `gates` cover the shallow cases without nightly; this digs deeper.
  # fuzz/seeds/ are committed regressions and are replayed every run.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Fuzz decode_dataset (60s)
        run: >
          cargo +nightly fuzz run decode_dataset fuzz/corpus/decode_dataset
          fuzz/seeds/decode_dataset -- -max_total_time=60 -timeout=10
          -rss_limit_mb=4096
        working-directory: .
