# The numbers are the game's, so they live in the dataset where a patch can
# change them and `assay diff` can see it. This file says only which skill,
# and the one thing that is not part of the skill: where you came from.
#
# Sneak Attack can be used from Hide or not, so leaving Hide is a
# circumstance and belongs here rather than in the skill.
skill = "skill.rogue.sneak_attack"

[context]
power_bonus_adjust = "-30"
