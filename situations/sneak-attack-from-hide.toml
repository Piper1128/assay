# The case the whole source analysis is built on. Sneak Attack scales at 0%,
# so the -30% Hide-exit power penalty multiplies nothing and the attack is
# immune to it — the zero is the mechanic, not a missing value.
name = "Sneak Attack, leaving Hide"

[strike]
scaling     = "0"
flat_bonus  = "15"
true_damage = "1"

[context]
power_bonus_adjust = "-30"
